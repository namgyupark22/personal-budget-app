<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#214e41"><title>나의 가계부</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173f32;background:#f5f6f2;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button,select,input{min-height:46px;border:1px solid #dce4db;border-radius:12px;background:white;padding:10px}button:disabled{opacity:.5;cursor:wait}main{max-width:760px;margin:auto;padding:26px 18px 110px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:28px;letter-spacing:-1px;margin:3px 0}h2{font-size:19px;margin:24px 0 12px}p{line-height:1.6}.muted,small{color:#718176}.eyebrow{letter-spacing:.15em;font-size:11px}.period{display:flex;gap:8px;margin:24px 0 12px}.period select{flex:1;min-width:0}.hero{background:#214e41;color:white;border-radius:24px;padding:25px;margin:20px 0}.hero small{color:#cbdacf}.hero strong{display:block;font-size:36px;margin:12px 0 24px;letter-spacing:-1px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics div{background:#ffffff10;padding:12px;border-radius:12px}.metrics b{display:block;margin-top:5px}.panel{padding:18px;background:white;border:1px solid #e4e9e0;border-radius:18px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:white;padding:16px;border:1px solid #e4e9e0;border-radius:16px;margin:8px 0}.row b,.row small{display:block}.row small{font-size:12px;margin-top:6px}.money{text-align:right;white-space:nowrap}.in{color:#177652}.out{color:#a5543d}.badge{font-size:12px;color:#93632b}.bar{height:6px;background:#e7ece5;border-radius:8px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#75a38b}.nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid #e0e6dc;padding:8px 6px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}.nav button{border:0;font-size:13px;min-width:57px}.nav .active{background:#edf3e9;font-weight:bold}.nav .add{background:#214e41;color:white;width:50px;font-size:24px}.message{background:#fff0d7;padding:14px;border-radius:12px;line-height:1.6;margin:12px 0}.empty{text-align:center;padding:40px 10px;color:#718176}.search{width:100%;margin:12px 0}dialog{border:0;border-radius:24px;padding:22px;width:min(620px,calc(100% - 20px));max-height:92dvh;background:#f9faf7;color:inherit}dialog::backdrop{background:#122a22b8}dialog h2{margin:0}form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}label{font-size:13px;display:block}label input,label select{width:100%;display:block;margin-top:6px}input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:#214e41;display:inline-block;margin:0 8px 0 0;vertical-align:middle}.check{display:flex;align-items:center;min-height:44px}.full{grid-column:1/-1}.primary{background:#214e41;color:white;border:0;font-weight:bold}.error{color:#a32d25;font-size:14px;line-height:1.5}.hidden{display:none!important}a{color:#27664e;overflow-wrap:anywhere}.tip{font-size:13px}.kind{width:100%;margin-top:12px}#saveTarget{font-size:14px;font-weight:bold;color:#27664e}#notice:empty{display:none}@media(max-width:420px){main{padding-inline:14px}.hero strong{font-size:30px}.nav{gap:0}.nav button{min-width:54px}.money{font-size:14px}dialog{padding:18px}}
</style></head><body><main><header><div><div class="eyebrow">MY MONEY</div><h1>나의 가계부</h1><small id="status">연결 준비 중</small></div><button id="settings" aria-label="연도별 연결 설정">설정</button></header><div class="period"><select id="year" aria-label="연도 선택"></select><select id="month" aria-label="월 선택"></select><button id="refresh" aria-label="새로고침">↻</button></div><section id="googlePanel" class="panel"><b>Google 시트 연결</b><p class="tip muted">처음 한 번 연결 설정이 필요해요. <a href="setup.html" target="_blank" rel="noopener">설정 안내 ↗</a></p><label>OAuth 클라이언트 ID<input id="oauthId" placeholder="…apps.googleusercontent.com" autocomplete="off"></label><button id="googleConnect" class="primary" style="margin-top:12px">Google 계정 연결</button><button id="googleDisconnect">연결 종료</button><p id="googleStatus" class="tip" role="status">연결 전에는 개인 기록을 불러오지 않습니다.</p></section><div id="notice" class="message" role="status"></div><div id="content" aria-live="polite"></div></main>
<nav class="nav" aria-label="주 메뉴"><button data-view="home">홈</button><button data-view="history">내역</button><button id="add" class="add" aria-label="기록 추가" disabled>＋</button><button data-view="accounts">계좌·카드</button><button data-view="annual">연간</button></nav>
<dialog id="entryDialog"><header><h2 id="formTitle">기록하기</h2><button id="closeEntry" aria-label="닫기">×</button></header><p id="saveTarget"></p><select id="kind" class="kind" aria-label="거래 종류"><option value="expense">지출</option><option value="income">수입</option><option value="transfer">계좌이체</option><option value="charge">온누리 충전</option><option value="all">상세 입력</option></select><form id="entryForm"></form></dialog>
<dialog id="settingsDialog"><header><h2>연도별 가계부 연결</h2><button id="closeSettings" aria-label="설정 닫기">×</button></header><p class="muted">앱 주소는 그대로, 연결할 시트만 추가하세요.</p><div id="bookList"></div><form id="connectForm"><label>연도<input id="connectYear" type="number" min="2000" max="2100" required></label><label class="full">새 스프레드시트 링크<input id="connectUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" required></label><p class="full tip muted">기존 파일을 복사하고 전체 탭 B2의 연도, 각 계좌의 이월잔액, 온누리 기준일을 확인하세요. 거래 입력값은 복사본에서 정리하고 수식은 유지해 주세요.</p><div id="connectError" class="full error" role="alert"></div><button class="primary full" id="connect">구성 확인 후 연결</button></form></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script><script src="sheets-core.js"></script><script src="sheets.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const LABELS=['날짜 (일)','수입 금액','받는 계좌','지출 금액','출금 계좌','결제카드','실적 제외','내용','카테고리','이체 입금액 / 충전액','실제 출금액 / 납입액','할인금액(원)'];
const todayParts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const today=Object.fromEntries(todayParts.map(p=>[p.type,p.value]));
let config={books:[]},data=null,view='home',seq=0,annualCache={},editing=null,formContext=null,busy=false,connecting=false,pending=null;
function rpc(name,arg){return window.BudgetSheets.invoke(name,arg);}
function context(){const year=Number($('year').value),b=config.books.find(b=>b.year===year);if(!b)throw Error('연결된 연도가 없습니다.');return {year,month:Number($('month').value),sourceId:b.id};}
function setBooks(c,year){config=c;$('year').innerHTML=c.books.map(b=>'<option value="'+b.year+'">'+b.year+'년</option>').join('');$('year').value=year||c.books.find(b=>b.year===Number(today.year))?.year||c.books.at(-1)?.year;}
async function init(){if(!BudgetSheets.connected()){setBooks(await rpc('getConfig'),Number($('year').value));$('status').textContent='Google 계정을 연결해 주세요';$('content').innerHTML='<section class="hero"><small>매일 조금 더 가볍게</small><strong>나의 돈을 한눈에</strong><small>연도별 기록을 같은 앱에서 관리하세요.</small></section>';return;}if(!(await rpc('getConfig')).books.length){$('add').disabled=true;$('status').textContent='사용할 시트를 등록해 주세요';$('content').innerHTML='<section class="hero"><strong>시트를 연결해 주세요</strong><small>설정에서 연도와 원본 시트 링크를 등록하면 기록을 불러옵니다.</small></section>';openSettings();return;}const ticket=++seq;$('add').disabled=true;$('content').innerHTML='<section class="hero"><small>나의 가계부</small><strong>기록을 확인 중…</strong><small>선택한 시트에서 최신 데이터를 가져오고 있어요.</small></section>';try{const result=await rpc('getInitialData',{year:Number($('year').value),month:Number($('month').value)});if(ticket!==seq)return;setBooks(result.config,result.data.year);data=result.data;$('month').value=data.month;$('status').textContent=data.year+'년 원본 시트 · '+data.rows.length+'건';$('notice').textContent='';$('add').disabled=false;render();}catch(e){if(ticket!==seq)return;data=null;$('status').textContent='연결 확인 필요';$('notice').textContent=e.message||e;$('googlePanel').classList.remove('hidden');}}
async function load(){const ticket=++seq;data=null;$('add').disabled=true;$('content').innerHTML='<p class="empty">기록을 불러오는 중…</p>';$('notice').textContent='';try{const result=await rpc('readMonth',context());if(ticket!==seq)return;data=result;$('status').textContent=data.year+'년 원본 시트 · '+data.rows.length+'건';$('add').disabled=false;render();}catch(e){if(ticket!==seq)return;$('content').innerHTML='<p class="message">'+esc(e.message||e)+'</p>';$('status').textContent='연결 확인 필요';$('googlePanel').classList.remove('hidden');}}
function kindOf(r){const v=r.values;return Number(v[9])||Number(v[10])?'transfer':Number(v[1])&&Number(v[3])?'mixed':Number(v[1])?'income':'expense';}
function item(r){const v=r.values,k=kindOf(r),amount=k==='transfer'?won(v[9]||v[10]):k==='mixed'?'입금 '+won(v[1])+' / 출금 '+won(v[3]):won(k==='income'?v[1]:v[3]);return '<button class="row" data-row="'+r.row+'"><span><b>'+esc(v[7]||(k==='transfer'?'계좌이체':'내용 없음'))+'</b><small>'+esc(v[0])+'일 · '+esc(v[8]||'미분류')+' · '+esc(k==='transfer'?v[4]+' → '+v[2]:v[5]||v[4]||v[2])+'</small>'+(v[5]&&v[6]?'<small class="badge">실적 제외</small>':'')+'</span><span class="money '+(k==='income'?'in':'out')+'">'+esc(amount)+'</span></button>';}
function sorted(){return [...data.rows].sort((a,b)=>Number(b.values[0])-Number(a.values[0])||b.row-a.row);}
function render(){if(!data)return;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const c=$('content');
 if(view==='home'){const cats=data.categories,inc=cats.filter(x=>x.group==='수입').reduce((s,x)=>s+x.amount,0),saving=cats.filter(x=>x.sub==='저축/투자').reduce((s,x)=>s+x.amount,0),expense=cats.filter(x=>x.group!=='수입'&&x.sub!=='저축/투자').reduce((s,x)=>s+x.amount,0);c.innerHTML='<section class="hero"><small>'+data.year+'년 '+data.month+'월 소비 · 시트 집계</small><strong>'+won(expense)+'</strong><div class="metrics"><div><small>수입</small><b>'+won(inc)+'</b></div><div><small>저축·투자</small><b>'+won(saving)+'</b></div></div></section><h2>많이 쓴 곳</h2>'+cats.filter(x=>x.group!=='수입'&&x.sub!=='저축/투자'&&x.amount>0).sort((a,b)=>b.amount-a.amount).slice(0,3).map(x=>'<div class="panel"><b>'+esc(x.name)+'</b><span style="float:right">'+won(x.amount)+'</span><div class="bar"><i style="width:'+Math.min(100,x.amount/Math.max(1,expense)*100)+'%"></i></div></div>').join('')+'<h2>최근 기록</h2>'+(sorted().slice(0,5).map(item).join('')||'<p class="empty">첫 기록을 남겨보세요.</p>');}
 else if(view==='history'){c.innerHTML='<input id="search" class="search" aria-label="거래 검색" placeholder="내용·카드·카테고리 검색"><div id="records"></div>';const draw=()=>{const q=$('search').value.toLowerCase();$('records').innerHTML=sorted().filter(r=>r.values.join(' ').toLowerCase().includes(q)).map(item).join('')||'<p class="empty">기록이 없어요.</p>';};$('search').oninput=draw;draw();}
 else if(view==='accounts')c.innerHTML='<h2>카드 실적</h2>'+data.cards.map(a=>'<div class="row"><b>'+esc(a.name)+'</b><span class="money">'+esc(a.used)+'<small>'+esc(a.status)+'</small></span></div>').join('')+'<h2>계좌 잔액</h2><p class="muted tip">선택한 연도의 장부 잔액입니다. 은행의 실시간 잔액이나 월말 잔액과 다를 수 있어요.</p>'+data.accounts.map(a=>'<div class="row"><b>'+esc(a.name)+'</b><span class="money">'+esc(a.balance)+'<small>이번 달 증감 '+esc(a.change)+'</small></span></div>').join('');
 else showAnnual();
}
async function showAnnual(){const ctx=context(),key=ctx.year+':'+ctx.sourceId,ticket=seq;$('content').innerHTML='<p class="empty">연간 집계 확인 중…</p>';try{const a=annualCache[key]||await rpc('readAnnual',ctx);annualCache[key]=a;if(ticket!==seq||view!=='annual')return;const metrics=a.grid.slice(1).filter(r=>r.slice(3,15).some(v=>/\d/.test(v))&&r.slice(0,3).some(Boolean));$('content').innerHTML='<h2>'+a.year+'년 월별 변화</h2><select id="metric" aria-label="비교 항목">'+metrics.map((r,i)=>'<option value="'+i+'">'+esc(r.slice(0,3).filter(Boolean).join(' · '))+'</option>').join('')+'</select><div id="annualRows"></div>';const draw=()=>{$('annualRows').innerHTML=(metrics[Number($('metric').value)]||[]).slice(3,15).map((v,i)=>'<div class="row"><b>'+(i+1)+'월</b><span>'+esc(v||'기록 없음')+'</span></div>').join('');};$('metric').onchange=draw;draw();}catch(e){if(ticket===seq&&view==='annual')$('content').innerHTML='<p class="message">'+esc(e.message||e)+'</p>';}}
function field(i){return $('entryForm').elements['v'+i];}
function openEntry(row){if(!data||busy)return;editing=row?data.rows.find(r=>r.row===row):null;if(editing?.readOnly){$('notice').textContent='직접 계산식이 들어 있는 거래는 원본 시트에서 수정해 주세요.';return;}pending=null;formContext={year:data.year,month:data.month,sourceId:data.sourceId};const vals=editing?[...editing.values]:Array(12).fill('');if(!editing){vals[6]=false;vals[0]=data.year===+today.year&&data.month===+today.month?+today.day:1;}
 $('saveTarget').textContent=formContext.year+'년 '+formContext.month+'월 가계부에 저장';$('formTitle').textContent=editing?'기록 수정':'기록하기';$('kind').value=editing?'all':'expense';$('kind').disabled=!!editing;
 $('entryForm').innerHTML=LABELS.map((label,i)=>{const opts=data.options[i]||[];let control;if(i===6)return '<label class="full check" data-field="6"><input name="v6" type="checkbox" '+(vals[6]?'checked':'')+'>실적 제외 · 해당하는 거래만 체크</label>';if(opts.length)control='<select name="v'+i+'"><option value="">선택 안 함</option>'+[...new Set([...opts,...(vals[i]?[String(vals[i])]:[])])].map(x=>'<option value="'+esc(x)+'" '+(String(vals[i])===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';else control='<input name="v'+i+'" type="'+([0,1,3,9,10,11].includes(i)?'number':'text')+'" '+([0,1,3,9,10,11].includes(i)?'min="0" step="1" inputmode="numeric"':'maxlength="500"')+' value="'+esc(vals[i])+'">';return '<label data-field="'+i+'" class="'+(i===7?'full':'')+'">'+label+control+'</label>';}).join('')+'<label class="full check" id="discountLabel"><input id="discountToggle" type="checkbox" '+(vals[11]?'checked':'')+'>할인 있음</label><div id="formError" class="full error" role="alert"></div><button id="save" class="primary full">저장하기</button>';
 field(5).onchange=()=>{if(field(4).value==='온누리')return;const link=data.links.find(l=>l.card===field(5).value);if(link)field(4).value=link.bank;};$('discountToggle').onchange=()=>{if(!$('discountToggle').checked)field(11).value='';applyKind(false);};applyKind(false);$('entryDialog').showModal();field(3).focus();}
function applyKind(clear=true){const k=$('kind').value,visible=k==='expense'?[0,3,4,5,6,7,8,11]:k==='income'?[0,1,2,7,8]:k==='transfer'||k==='charge'?[0,2,4,7,9,10]:Array.from({length:12},(_,i)=>i);document.querySelectorAll('[data-field]').forEach(el=>{const i=+el.dataset.field,hidden=!visible.includes(i);el.classList.toggle('hidden',hidden||(i===11&&k==='expense'&&!$('discountToggle').checked));if(clear&&hidden&&!editing){if(i===6)field(i).checked=false;else field(i).value='';}});$('discountLabel').classList.toggle('hidden',k!=='expense');field(2).disabled=k==='charge';if(k==='charge')field(2).value='온누리';if(k==='transfer')field(10).placeholder='비우면 이체 입금액과 동일';else field(10).placeholder='실제로 납입한 금액';}
function closeEntry(){if(busy)return;$('entryDialog').close();if(pending)load();}
$('entryForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const k=$('kind').value;const values=Array.from({length:12},(_,i)=>i===6?field(i).checked:field(i).value);if(k==='transfer'&&values[10]==='')values[10]=values[9];if(k==='charge'&&(!values[9]||values[10]==='')){$('formError').textContent='충전액과 실제 납입액을 입력해 주세요.';return;}if(!pending)pending={...formContext,row:editing?.row||0,token:editing?.token||'',values,requestId:crypto.randomUUID()};busy=true;$('save').disabled=true;$('formError').textContent='';try{await rpc('saveEntry',pending);busy=false;pending=null;$('entryDialog').close();annualCache={};await load();$('notice').textContent=formContext.year+'년 '+formContext.month+'월 원본 시트에 저장했어요.';}catch(e){busy=false;$('save').disabled=false;$('formError').textContent=(e.message||e)+' 재시도하면 처음 보낸 내용으로 저장합니다. 내용을 바꾸려면 닫고 새로고침 후 다시 열어 주세요.';}};
function openSettings(){if(busy)return;$('bookList').innerHTML=config.books.map(b=>'<div class="panel"><b>'+b.year+'년</b><p><a href="https://docs.google.com/spreadsheets/d/'+encodeURIComponent(b.id)+'/edit" target="_blank" rel="noopener noreferrer">'+esc(b.name)+' ↗</a></p></div>').join('');$('connectYear').value=config.books.length?Math.max(Number(today.year),...config.books.map(b=>b.year))+1:Number(today.year);$('connectError').textContent='';$('settingsDialog').showModal();}
$('connectForm').onsubmit=async e=>{e.preventDefault();if(connecting)return;connecting=true;$('connect').disabled=true;$('connectError').textContent='';const y=Number($('connectYear').value);try{const c=await rpc('registerYear',{year:y,url:$('connectUrl').value});setBooks(c,y);annualCache={};$('settingsDialog').close();await load();$('notice').textContent=y+'년 시트를 연결했어요. 앱 주소는 그대로 사용하세요.';}catch(e){$('connectError').textContent=e.message||e;}finally{connecting=false;$('connect').disabled=false;}};
$('month').innerHTML=Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'월</option>').join('');$('month').value=+today.month;
$('year').onchange=()=>{annualCache={};load();};$('month').onchange=load;$('refresh').onclick=()=>{annualCache={};init();};$('settings').onclick=()=>{$('googlePanel').classList.remove('hidden');openSettings();};$('closeSettings').onclick=()=>{if(!connecting)$('settingsDialog').close();};$('settingsDialog').oncancel=e=>{if(connecting)e.preventDefault();};$('add').onclick=()=>openEntry();$('closeEntry').onclick=closeEntry;$('entryDialog').oncancel=e=>{e.preventDefault();closeEntry();};$('kind').onchange=()=>applyKind();$('content').onclick=e=>{const r=e.target.closest('[data-row]');if(r)openEntry(Number(r.dataset.row));};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});$('oauthId').value=BudgetSheets.clientId();
$('googleConnect').onclick=async()=>{try{$('googleStatus').textContent='Google 연결 중…';await BudgetSheets.connect($('oauthId').value);$('googleStatus').textContent='연결됐어요';$('googlePanel').classList.add('hidden');annualCache={};await init();}catch(e){$('googleStatus').textContent=e.message||e;}};

init();
