:14px}.card-grid{gap:8px}.card-grid .panel{padding:14px}.card-grid strong{font-size:18px}.nav button{min-width:56px;font-size:12px}}

</style></head><body><main><header><div><div class="eyebrow">MY MONEY</div><h1>나의 가계부</h1><small id="status">연결 준비 중</small></div><button id="settings" aria-label="연도별 연결 설정">설정</button></header><div class="period"><select id="year" aria-label="연도 선택"></select><select id="month" aria-label="월 선택"></select><button id="refresh" aria-label="새로고침">↻</button></div><section id="googlePanel" class="panel"><b>Google 시트 연결</b><p class="tip muted">처음 한 번 연결 설정이 필요해요. <a href="setup.html" target="_blank" rel="noopener">설정 안내 ↗</a></p><label>OAuth 클라이언트 ID<input id="oauthId" placeholder="…apps.googleusercontent.com" autocomplete="off"></label><button id="googleConnect" class="primary" style="margin-top:12px">Google 계정 연결</button><button id="googleDisconnect">연결 종료</button><p id="googleStatus" class="tip" role="status">연결 전에는 개인 기록을 불러오지 않습니다.</p></section><div id="notice" class="message" role="status"></div><div id="content" aria-live="polite"></div></main>

<dialog id="settingsDialog"><header><h2>연도별 가계부 연결</h2><button id="closeSettings" aria-label="설정 닫기">×</button></header><p class="muted">앱 주소는 그대로, 연결할 시트만 추가하세요.</p><div id="bookList"></div><form id="connectForm"><label>연도<input id="connectYear" type="number" min="2000" max="2100" required></label><label class="full">새 스프레드시트 링크<input id="connectUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" required></label><p class="full tip muted">기존 파일을 복사하고 전체 탭 B2의 연도, 각 계좌의 이월잔액, 온누리 기준일을 확인하세요. 거래 입력값은 복사본에서 정리하고 수식은 유지해 주세요.</p><div id="connectError" class="full error" role="alert"></div><button class="primary full" id="connect">구성 확인 후 연결</button></form></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script><script src="sheets-core.js"></script><script src="sheets.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const LABELS=['날짜 (일)','수입 금액','받는 계좌','지출 금액','출금 계좌','결제카드','실적 제외','내용','카테고리','이체 입금액 / 충전액','실제 출금액 / 납입액','할인금액(원)'];
const todayParts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const today=Object.fromEntries(todayParts.map(p=>[p.type,p.value]));
let config={books:[]},data=null,view='home',seq=0,annualCache={},editing=null,formContext=null,busy=false,connecting=false,pending=null;
let historyMode='list',calendarDay=null;
const comparisonCache=new Map();
function rpc(name,arg){return window.BudgetSheets.invoke(name,arg);}
function context(){const year=Number($('year').value),b=config.books.find(b=>b.year===year);if(!b)throw Error('연결된 연도가 없습니다.');return {year,month:Number($('month').value),sourceId:b.id};}
function setBooks(c,year){config=c;$('year').innerHTML=c.books.map(b=>'<option value="'+b.year+'">'+b.year+'년</option>').join('');$('year').value=year||c.books.find(b=>b.year===Number(today.year))?.year||c.books.at(-1)?.year;}
async function init(){if(!BudgetSheets.connected()){setBooks(await rpc('getConfig'),Number($('year').value));$('status').textContent='Google 계정을 연결해 주세요';$('content').innerHTML='<section class="hero"><small>매일 조금 더 가볍게</small><strong>나의 돈을 한눈에</strong><small>연도별 기록을 같은 앱에서 관리하세요.</small></section>';return;}if(!(await rpc('getConfig')).books.length){$('add').disabled=true;$('status').textContent='사용할 시트를 등록해 주세요';$('content').innerHTML='<section class="hero"><strong>시트를 연결해 주세요</strong><small>설정에서 연도와 원본 시트 링크를 등록하면 기록을 불러옵니다.</small></section>';openSettings();return;}const ticket=++seq;$('add').disabled=true;$('content').innerHTML='<section class="hero"><small>나의 가계부</small><strong>기록을 확인 중…</strong><small>선택한 시트에서 최신 데이터를 가져오고 있어요.</small></section>';try{const result=await rpc('getInitialData',{year:Number($('year').value),month:Number($('month').value)});if(ticket!==seq)return;setBooks(result.config,result.data.year);data=result.data;$('month').value=data.month;$('status').textContent=data.year+'년 원본 시트 · '+data.rows.length+'건';$('notice').textContent='';$('add').disabled=false;render();}catch(e){if(ticket!==seq)return;data=null;$('status').textContent='연결 확인 필요';$('notice').textContent=e.message||e;$('googlePanel').classList.remove('hidden');}}
async function load(){const ticket=++seq;data=null;$('add').disabled=true;$('content').innerHTML='<p class="empty">기록을 불러오는 중…</p>';$('notice').textContent='';try{const result=await rpc('readMonth',context());if(ticket!==seq)return;data=result;$('status').textContent=data.year+'년 원본 시트 · '+data.rows.length+'건';$('add').disabled=false;render();}catch(e){if(ticket!==seq)return;$('content').innerHTML='<p class="message">'+esc(e.message||e)+'</p>';$('status').textContent='연결 확인 필요';$('googlePanel').classList.remove('hidden');}}
function kindOf(r){const v=r.values;return Number(v[9])||Number(v[10])?'transfer':Number(v[1])&&Number(v[3])?'mixed':Number(v[1])?'income':'expense';}
function item(r){const v=r.values,k=kindOf(r),amount=k==='transfer'?won(v[9]||v[10]):k==='mixed'?'입금 '+won(v[1])+' / 출금 '+won(v[3]):won(k==='income'?v[1]:v[3]);return '<button class="row" data-row="'+r.row+'"><span><b>'+esc(v[7]||(k==='transfer'?'계좌이체':'내용 없음'))+'</b><small>'+esc(v[0])+'일 · '+esc(v[8]||'미분류')+' · '+esc(k==='transfer'?v[4]+' → '+v[2]:v[5]||v[4]||v[2])+'</small>'+(v[5]&&v[6]?'<small class="badge">실적 제외</small>':'')+'</span><span class="money '+(k==='income'?'in':'out')+'">'+esc(amount)+'</span></button>';}
function sorted(){return [...data.rows].sort((a,b)=>Number(b.values[0])-Number(a.values[0])||b.row-a.row);}

function amountNumber(value){if(typeof value==='number')return Number.isFinite(value)?value:null;const str=String(value??'').trim();if(!str)return null;if(str==='-'||str==='₩-')return 0;const clean=str.replace(/[₩원,\s]/g,'');if(!/^-?\d+(?:\.\d+)?$/.test(clean))return null;return Number(clean);}
function overviewTotals(d){const accounts=d.accounts.filter(a=>a.name&&!/^(합계|총계|총 합계)$/.test(a.name.trim())).map(a=>({...a,value:amountNumber(a.balance)}));const available=accounts.filter(a=>!['주택청약','국민적금','비상금','데이트통'].includes(a.name.trim()));const complete=available.length>0&&available.every(a=>a.value!==null);const reserve=name=>{const a=accounts.find(a=>a.name.trim()===name);return a?a.value:null;};const cats=d.categories;return{accounts,balance:complete?available.reduce((n,a)=>n+a.value,0):null,emergency:reserve('비상금'),dating:reserve('데이트통'),income:cats.filter(a=>a.group==='수입').reduce((n,a)=>n+a.amount,0),saving:cats.filter(a=>a.group!=='수입'&&a.sub==='저축/투자').reduce((n,a)=>n+a.amount,0),expense:cats.filter(a=>a.group!=='수입'&&a.sub!=='저축/투자').reduce((n,a)=>n+a.amount,0),categories:cats.filter(a=>a.group!=='수입'&&a.sub!=='저축/투자'&&a.amount!==0).sort((a,b)=>b.amount-a.amount)};}
function cardPanels(){return '<div class="card-grid">'+data.cards.filter(a=>a.name).map(a=>{const used=amountNumber(a.used),target=amountNumber(a.target),valid=used!==null&&target!==null&&target>0;return '<article class="panel"><b>'+esc(a.name)+'</b><strong>'+(used===null?'확인 필요':won(used))+'</strong><small>목표 '+(target===null||target<=0?'미설정':won(target))+'</small>'+(valid?'<div class="bar"><i style="width:'+Math.min(100,Math.max(0,used/target*100))+'%"></i></div><span class="badge">'+(used>=target?'목표 달성':won(target-used)+' 남음')+'</span>':'')+'<small>'+esc(a.status||'')+'</small></article>';}).join('')+'</div>';}
function accountTable(accounts){return '<div class="table-wrap"><table class="account-table"><thead><tr><th>계좌·보관처</th><th>장부 잔액</th><th>'+data.month+'월 증감</th></tr></thead><tbody>'+accounts.map(a=>{const change=amountNumber(a.change);return '<tr><th scope="row">'+esc(a.name)+'</th><td class="'+(a.value<0?'negative':'')+'">'+(a.value===null?'확인 필요':won(a.value))+'</td><td>'+ (change===null?'확인 필요':(change>0?'+':'')+won(change))+'</td></tr>';}).join('')+'</tbody></table></div>';}

function categoryIdentity(c){
 const sub=String(c.sub||'').trim(),name=String(c.name||'').trim();
 if(c.group==='수입')return {section:'수입',label:sub||'수입'};
 if(sub==='저축/투자'||sub==='저축·투자')return {section:'저축·투자',label:'저축·투자'};
 if(sub==='결혼준비'||name==='결혼준비')return {section:'특별지출',label:'결혼준비'};
 const section=c.group==='고정지출'?'고정지출':'변동지출';
 const label=name==='여행'?'여행':sub==='생활'?'주거·공과금':sub==='문화'?'구독·멤버십':sub==='회비'?'정기 회비':sub==='기타'&&name==='회비'?'비정기 회비':sub||'미분류';
 return {section,label};
}
function categoryGroups(categories){
 const groups=new Map();
 for(const c of categories){if(!c.name)continue;const {section,label}=categoryIdentity(c);if(section==='수입')continue;const key=section+'|'+label;if(!groups.has(key))groups.set(key,{section,label,amount:0,items:[]});const g=groups.get(key);g.amount+=Number(c.amount)||0;g.items.push(c);}
 return [...groups.values()].sort((a,b)=>b.amount-a.amount);
}
function categoryTransactions(d,name){return d.rows.filter(r=>String(r.values[8]||'').trim()===name&&Number(r.values[3])!==0&&!Number(r.values[9])&&!Number(r.values[10])).sort((a,b)=>Number(b.values[0])-Number(a.values[0])||b.row-a.row);}
function spendingBreakdown(){
 const groups=categoryGroups(data.categories),special=groups.filter(g=>g.section==='특별지출').reduce((n,g)=>n+g.amount,0),normal=groups.filter(g=>g.section==='고정지출'||g.section==='변동지출').reduce((n,g)=>n+g.amount,0);
 const blocks=['고정지출','변동지출','특별지출','저축·투자'].map(section=>{
  const list=groups.filter(g=>g.section===section),total=list.reduce((n,g)=>n+g.amount,0);if(!list.length)return '';
  return '<section class="category-block" data-kind="'+section+'"><h3><span>'+section+'</span><span>'+won(total)+'</span></h3>'+list.map(g=>{

function periodWindow(d){
 const current=d.year===+today.year&&d.month===+today.month;
 const prev=d.month===1?{year:d.year-1,month:12}:{year:d.year,month:d.month-1};
 const days=new Date(d.year,d.month,0).getDate(),previousDays=new Date(prev.year,prev.month,0).getDate();
 const end=current?Math.min(+today.day,days,previousDays):days;
 return {...prev,current,end,previousEnd:current?end:previousDays,future:d.year>+today.year||(d.year===+today.year&&d.month>+today.month)};
}
function consumption(d,end=31){
 const lookup=new Map(d.categories.map(c=>[c.name,categoryIdentity(c)])),groups=new Map();let total=0,unknown=0;
 for(const r of d.rows){const v=r.values,day=Number(v[0]);if(!Number.isInteger(day)||day<1||day>end||Number(v[9])||Number(v[10]))continue;
 const amount=Number(v[3])||0;if(!amount)continue;const identity=lookup.get(String(v[8]||'').trim());
 if(identity?.section==='수입'||identity?.section==='저축·투자')continue;
 const label=identity?.label||'미분류';if(!identity)unknown++;total+=amount;groups.set(label,(groups.get(label)||0)+amount);
 }return {total,groups,unknown};
}

$('year').onchange=()=>{annualCache={};comparisonCache.clear();load();};$('month').onchange=load;$('refresh').onclick=()=>{annualCache={};comparisonCache.clear();init();};$('settings').onclick=()=>{$('googlePanel').classList.remove('hidden');openSettings();};$('closeSettings').onclick=()=>{if(!connecting)$('settingsDialog').close();};$('settingsDialog').oncancel=e=>{if(connecting)e.preventDefault();};$('add').onclick=()=>openEntry();$('closeEntry').onclick=closeEntry;$('entryDialog').oncancel=e=>{e.preventDefault();closeEntry();};$('kind').onchange=()=>applyKind();$('content').onclick=e=>{const button=e.target.closest('button');if(!button)return;const a=button.dataset;if(a.row){openEntry(Number(a.row));return;}if(a.quick){openFavorite(a.quick);return;}if(a.removeQuick){try{localStorage.setItem(favoriteKey(),JSON.stringify(favorites().filter(x=>x.id!==a.removeQuick)));render();}catch{$('notice').textContent='브라우저 저장 공간을 확인해 주세요.';}return;}if(a.historyMode){historyMode=a.historyMode;renderHistory();return;}if(a.day){calendarDay=Number(a.day);renderHistory();return;}if('retryComparison' in a)showComparison();};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});$('oauthId').value=BudgetSheets.clientId();
$('googleConnect').onclick=async()=>{try{$('googleStatus').textContent='Google 연결 중…';await BudgetSheets.connect($('oauthId').value);$('googleStatus').textContent='연결됐어요';$('googlePanel').classList.add('hidden');annualCache={};comparisonCache.clear();await init();}catch(e){$('googleStatus').textContent=e.message||e;}};
$('googleDisconnect').onclick=()=>{BudgetSheets.disconnect();data=null;annualCache={};comparisonCache.clear();seq++;$('add').disabled=true;$('googleStatus').textContent='연결을 종료했어요.';init();};
init();
</script></body></html>
